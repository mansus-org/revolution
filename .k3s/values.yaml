# Deploy settings for revolution.mansus.org on the mansus.org cluster.
# All options: charts/app/values.yaml in nemoNoboru/k3s-hetzner-gitops.

ingress:
  host: revolution.mansus.org

port: 8080

healthCheck:
  path: /

# busybox httpd needs a few MB.
resources:
  requests: { cpu: 5m, memory: 8Mi }
  limits: { memory: 32Mi }
