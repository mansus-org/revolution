# Build the repo's Dockerfile and push it to GHCR on every push to main.
# The cluster notices the new sha-<commit> tag within a few minutes and
# deploys it (Argo CD Image Updater). Nothing else to do per release.
# Docs: docs/app-platform/ in nemoNoboru/k3s-hetzner-gitops.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build at a time; a newer push waits instead of racing an older one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    # Self-hosted ARC runners on the cluster (apps/arc-runner.yaml).
    runs-on: arc-runner
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase: ghcr.io/mansus-org/<repo>.
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<7 char commit> (what the cluster deploys) and latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
